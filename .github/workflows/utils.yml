name: LocalStack Extensions Utils Tests

on:
  schedule:
    - cron: '0 2 * * 1-5'
  push:
    paths:
      - utils/**
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/utils.yml
      - utils/**
  workflow_dispatch:

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd utils
          pip install -e '.[dev,test]'

      - name: Lint
        run: |
          cd utils
          make lint

      - name: Run unit tests
        run: |
          cd utils
          make test-unit

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd utils
          pip install -e '.[dev,test]'

      - name: Run integration tests
        run: |
          docker pull moul/grpcbin &
          cd utils
          make test-integration

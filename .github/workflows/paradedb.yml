name: LocalStack ParadeDB Extension Tests

on:
  schedule:
    - cron: '0 2 * * 1-5'
  push:
    paths:
      - .github/workflows/paradedb.yml
      - paradedb/**
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/paradedb.yml
      - paradedb/**
  workflow_dispatch:

env:
  LOCALSTACK_DISABLE_EVENTS: "1"
  LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

jobs:
  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      matrix:
        tag:
          - latest
          - dev
    env:
      IMAGE_NAME: localstack/localstack-pro:${{matrix.tag}}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup LocalStack and extension
        run: |
          cd paradedb

          docker pull "$IMAGE_NAME"
          docker pull paradedb/paradedb
          pip install localstack

          make install
          make lint
          make dist
          localstack extensions -v install file://"$(ls ./dist/localstack_extension_paradedb-*.tar.gz)"

          DEBUG=1 localstack start -d
          localstack wait

      - name: Run integration tests
        run: |
          cd paradedb
          make test

      - name: Print logs
        if: always()
        run: |
          localstack logs
          localstack stop

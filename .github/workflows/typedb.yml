name: LocalStack TypeDB Extension Tests

on:
  schedule:
    - cron: '0 2 * * 1-5'
  push:
    paths:
      - .github/workflows/typedb.yml
      - typedb/**
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/typedb.yml
      - typedb/**
  workflow_dispatch:

env:
  LOCALSTACK_DISABLE_EVENTS: "1"
  LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

jobs:
  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      matrix:
        tag:
          - latest
          - dev
    env:
      IMAGE_NAME: localstack/localstack-pro:${{matrix.tag}}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup LocalStack and extension
        run: |
          cd typedb

          docker pull "$IMAGE_NAME"
          docker pull typedb/typedb
          pip install localstack

          make install
          make lint
          make dist
          localstack extensions -v install file://"$(ls ./dist/localstack_extension_typedb-*.tar.gz)"

          DEBUG=1 localstack start -d
          localstack wait

      - name: Run integration tests
        run: |
          cd typedb
          make test

      - name: Print logs
        if: always()
        run: |
          localstack logs
          localstack stop

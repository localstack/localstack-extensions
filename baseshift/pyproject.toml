[build-system]
requires = ["setuptools", "wheel", "plux>=1.3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "localstack-baseshift"
version = "0.1.0"
description = "Baseshift Extension for LocalStack"
readme = {file = "README.md", content-type = "text/markdown; charset=UTF-8"}
requires-python = ">=3.9"
authors = [
    { name = "LocalStack team"}
]
keywords = ["LocalStack", "Baseshift", "PostgreSQL", "MySQL"]
classifiers = []
dependencies = [
    "localstack-extensions-utils"
]

[project.urls]
Homepage = "https://github.com/localstack/localstack-extensions/tree/main/baseshift"

[project.optional-dependencies]
dev = [
    "boto3",
    "build",
    "jsonpatch",
    "localstack-core",
    "psycopg2-binary",
    "requests",
    "pytest",
    "rolo",
    "ruff",
    "twisted"
]

[tool.setuptools]
packages = ["localstack_baseshift"]

[project.entry-points."localstack.extensions"]
localstack-baseshift = "localstack_baseshift.extension:BaseshiftExtension"

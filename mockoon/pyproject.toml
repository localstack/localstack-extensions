[build-system]
requires = ["setuptools", "wheel", "plux>=1.3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "localstack-mockoon"
version = "0.1.0"
description = "Mockoon Extension for LocalStack"
readme = {file = "README.md", content-type = "text/markdown; charset=UTF-8"}
requires-python = ">=3.9"
authors = [
    { name = "LocalStack team"}
]
keywords = ["LocalStack", "Mockoon"]
classifiers = []
dependencies = [
    "localstack-extensions-utils",
    "priority"
]

[project.urls]
Homepage = "https://github.com/localstack/localstack-extensions/tree/main/mockoon"

[project.optional-dependencies]
dev = [
    "boto3",
    "build",
    "jsonpatch",
    "localstack-core",
    "pytest",
    "rolo",
    "ruff",
    "twisted"
]

[tool.setuptools.package-data]
localstack_mockoon = ["*.json"]

[project.entry-points."localstack.extensions"]
localstack-mockoon = "localstack_mockoon.extension:MockoonExtension"
